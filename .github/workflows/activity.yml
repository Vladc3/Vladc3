name: activity

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, readme-larp]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions pinned by commit SHA (checkout v4, ghaction-github-pages v5)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - run: python3 build/test_activity.py

      - run: mkdir -p dist && python3 build/activity.py "$GITHUB_REPOSITORY_OWNER" dist/activity.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
